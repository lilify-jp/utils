<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">Card Details</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="cc.css">
</head>
<body class="cc-page">
  <div class="card">
    <form id="ccForm" autocomplete="on">
      <div class="field">
        <label for="cardName" data-i18n="nameLabel">Cardholder Name</label>
        <input
          type="text"
          id="cardName"
          name="cc-name"
          autocomplete="cc-name"
          placeholder="TARO YAMADA"
          required
        >
      </div>

      <div class="field">
        <label for="cardNumber" data-i18n="numberLabel">Card Number</label>
        <input
          type="text"
          id="cardNumber"
          name="cc-number"
          inputmode="numeric"
          autocomplete="cc-number"
          placeholder="0000 0000 0000 0000"
          maxlength="19"
          pattern="[0-9 ]{13,19}"
          required
        >
      </div>

      <div class="row">
        <div class="field">
          <label for="cardExpiry" data-i18n="expiryLabel">Expiry (MM/YY)</label>
          <input
            type="text"
            id="cardExpiry"
            name="cc-exp"
            inputmode="numeric"
            autocomplete="cc-exp"
            placeholder="MM/YY"
            maxlength="5"
            pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
            required
          >
        </div>
        <div class="field">
          <label for="cardCvc" data-i18n="cvcLabel">CVC</label>
          <input
            type="text"
            id="cardCvc"
            name="cc-csc"
            inputmode="numeric"
            autocomplete="cc-csc"
            placeholder="CVC"
            maxlength="4"
            pattern="[0-9]{3,4}"
            required
          >
        </div>
      </div>
    </form>
  </div>

<script src="i18n.js"></script>
<script>
  I18N.init({
    en: {
      pageTitle: "Card Details",
      nameLabel: "Cardholder Name",
      numberLabel: "Card Number",
      expiryLabel: "Expiry (MM/YY)",
      cvcLabel: "CVC"
    },
    ja: {
      pageTitle: "カード情報",
      nameLabel: "カード名義人",
      numberLabel: "カード番号",
      expiryLabel: "有効期限 (MM/YY)",
      cvcLabel: "セキュリティコード"
    }
  }, 'en');

  const numberInput = document.getElementById('cardNumber');
  const expiryInput = document.getElementById('cardExpiry');
  const cvcInput = document.getElementById('cardCvc');

  numberInput.addEventListener('input', () => {
    const digits = numberInput.value.replace(/\D/g, '').slice(0, 16);
    numberInput.value = digits.replace(/(.{4})/g, '$1 ').trim();
  });

  expiryInput.addEventListener('input', () => {
    let digits = expiryInput.value.replace(/\D/g, '').slice(0, 4);
    if (digits.length >= 3) {
      digits = digits.slice(0, 2) + '/' + digits.slice(2);
    }
    expiryInput.value = digits;
  });

  cvcInput.addEventListener('input', () => {
    cvcInput.value = cvcInput.value.replace(/\D/g, '').slice(0, 4);
  });
</script>
</body>
</html>
